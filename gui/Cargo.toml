[package]
name = "sidegate"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
